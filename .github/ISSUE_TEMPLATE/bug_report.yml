name: Bug report
description: Report a reproducible defect with anonymized inputs
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not upload private articles, real names, photos, QR codes, local paths, or secrets."
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and Python version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Commands and a synthetic manuscript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: "I removed personal data, private content, local paths, and secrets."
          required: true
